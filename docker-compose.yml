services:
  app:
    build:
      context: .
    image: nanfest-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    volumes:
      # Build output produced on the host with `npm run build`.
      # Mounted read-write because Wrangler creates a .wrangler/ scratch dir here.
      - ./dist:/app/dist
    # Internal only — reachable from nginx as http://app:8787, not exposed to the host.
    expose:
      - "8787"
    networks:
      - web

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # Static client build — nginx serves these files directly.
      - ./dist/client:/usr/share/nginx/html:ro
      # Cloudflare Origin Certificate + key live here (see DOCKER.md).
      - ./certs:/etc/nginx/certs:ro
    networks:
      - web

networks:
  web:
    driver: bridge
