services:
  app:
    build:
      context: .
      target: app
      args:
        # ฝัง R2 base URL เข้า client bundle ตอน build (อ่านจาก .env อัตโนมัติ)
        VITE_R2_BASE: ${VITE_R2_BASE}
    image: nanfest-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    # dist ถูก build + bake เข้า image แล้ว ไม่ต้อง mount จาก host
    # Internal only — reachable from nginx as http://app:8787, not exposed to the host.
    expose:
      - "8787"
    networks:
      - web

  nginx:
    build:
      context: .
      target: web
      args:
        VITE_R2_BASE: ${VITE_R2_BASE}
    image: nanfest-web
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # static client build ถูก bake เข้า image แล้ว (ไม่ต้อง mount ./dist/client)
      # Cloudflare Origin Certificate + key live here (see DOCKER.md).
      - ./certs:/etc/nginx/certs:ro
    networks:
      - web

networks:
  web:
    driver: bridge
