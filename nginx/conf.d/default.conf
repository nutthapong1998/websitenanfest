# ---- Restore the real visitor IP from Cloudflare ----------------------------
# Without this, every request appears to come from a Cloudflare edge IP.
# IP ranges: https://www.cloudflare.com/ips/  (update if Cloudflare changes them)
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# Upstream worker container (Wrangler / workerd).
upstream app_upstream {
    server app:8787;
    keepalive 32;
}

# ---- HTTP: redirect everything to HTTPS --------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # If you ever use HTTP-01 ACME challenges, serve them before redirecting.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS: terminate TLS with the Cloudflare Origin Certificate -------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    # TODO: set this to your real domain.
    server_name example.com www.example.com;

    ssl_certificate     /etc/nginx/certs/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/certs/cloudflare-origin.key;

    # --- Cloudflare Authenticated Origin Pulls (optional but recommended) ---
    # Ensures only Cloudflare can connect to this origin. Download the CA from
    # https://developers.cloudflare.com/ssl/origin-configuration/authenticated-origin-pull/
    # and mount it at certs/cloudflare-origin-pull-ca.pem, then uncomment:
    # ssl_client_certificate /etc/nginx/certs/cloudflare-origin-pull-ca.pem;
    # ssl_verify_client on;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Reasonable upload size for forms; raise if you serve large uploads.
    client_max_body_size 25m;

    # Static client build (./dist/client). nginx serves these directly — including
    # the large videos/audio that exceed the Worker 25 MiB asset limit.
    root /usr/share/nginx/html;

    # Hashed, immutable build assets — serve from disk, long-cache, never proxy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Enable byte-range requests so <video>/<audio> can seek.
        add_header Accept-Ranges bytes;
        try_files $uri =404;
    }

    # Everything else: serve a matching static file if one exists, otherwise
    # hand off to the Worker for server-side rendering.
    location / {
        try_files $uri @worker;
    }

    location @worker {
        proxy_pass http://app_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / streaming support.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
    }
}
